<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0a0a0a">
<title>ChromaVue — Détecteur de couleurs</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --bg:#0a0a0a; --surface:#141414; --surface2:#1e1e1e;
  --border:rgba(255,255,255,0.08); --text:#f0ede8;
  --text-muted:rgba(240,237,232,0.45);
  --accent:#e8c46a; --accent-dim:rgba(232,196,106,0.15);
  --font:'Helvetica Neue',Arial,sans-serif;
}
html,body { height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--font); }
#app { display:flex; flex-direction:column; height:100dvh; height:100vh; position:relative; overflow:hidden; }

/* CAMERA */
#camera-container { position:relative; flex:1; overflow:hidden; background:#000; }
#video { width:100%; height:100%; object-fit:cover; display:block; transform:scaleX(-1); }
#canvas-hidden { display:none; }

/* MAGNIFIER */
#magnifier {
  position:absolute; width:90px; height:90px; border-radius:50%;
  border:3px solid rgba(255,255,255,0.85);
  overflow:hidden; pointer-events:none; display:none;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
  transform:translate(-50%,-130%);
}
#magnifier canvas { position:absolute; top:0; left:0; }

/* CROSSHAIR */
#crosshair {
  position:absolute; width:52px; height:52px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  transition:transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
  filter:drop-shadow(0 0 4px rgba(0,0,0,0.5));
}
#crosshair.tap { transform:translate(-50%,-50%) scale(0.82); }
#crosshair svg { width:100%; height:100%; }

/* RIPPLE */
.ripple {
  position:absolute; border-radius:50%; width:90px; height:90px;
  transform:translate(-50%,-50%) scale(0);
  border:2px solid rgba(255,255,255,0.7);
  animation:rippleAnim 0.55s ease-out forwards;
  pointer-events:none;
}
@keyframes rippleAnim { to { transform:translate(-50%,-50%) scale(1); opacity:0; } }

/* STABILITY RING */
#stability-ring {
  position:absolute; width:64px; height:64px;
  transform:translate(-50%,-50%);
  pointer-events:none; opacity:0; transition:opacity 0.3s;
}
#stability-ring.show { opacity:1; }
#stability-ring svg { width:100%; height:100%; }
#stab-arc {
  stroke-dasharray:0 157;
  transition:stroke-dasharray 0.15s linear;
}

/* TOP BAR */
#topbar {
  position:absolute; top:0; left:0; right:0;
  padding:max(env(safe-area-inset-top,12px),12px) 20px 12px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,0.75) 0%,transparent 100%);
  z-index:10; gap:10px;
}
#app-title { font-size:18px; font-weight:300; letter-spacing:0.08em; flex:1; }
#app-title span { color:var(--accent); font-weight:500; }

.top-btn {
  width:36px; height:36px; border:none;
  background:rgba(255,255,255,0.12); border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px; backdrop-filter:blur(4px);
  transition:background 0.2s; color:var(--text); flex-shrink:0;
}
.top-btn.active { background:var(--accent); color:#000; }

/* LIVE BADGE */
#live-badge {
  position:absolute; top:60px; left:20px;
  display:flex; align-items:center; gap:6px;
  font-size:11px; color:rgba(255,255,255,0.55); z-index:10;
}
#live-dot { width:6px; height:6px; border-radius:50%; background:#4caf50; animation:pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }

/* LUMINOSITY BADGE */
#lum-badge {
  position:absolute; top:60px; right:16px;
  background:rgba(0,0,0,0.45); backdrop-filter:blur(6px);
  border:1px solid var(--border); border-radius:20px;
  padding:4px 10px; font-size:11px; letter-spacing:0.05em;
  color:var(--text-muted); z-index:10; display:flex; align-items:center; gap:5px;
}
#lum-icon { font-size:13px; }

/* HISTORY */
#history-strip {
  position:absolute; top:90px; right:0;
  display:flex; flex-direction:column; gap:6px; padding:8px; z-index:10;
}
.hist-swatch {
  width:28px; height:28px; border-radius:8px;
  border:1.5px solid rgba(255,255,255,0.2);
  cursor:pointer; transition:transform 0.15s; flex-shrink:0;
}
.hist-swatch:active { transform:scale(0.88); }

/* HINT */
#hint {
  position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%);
  text-align:center; pointer-events:none; transition:opacity 0.4s;
}
#hint.hidden { opacity:0; }
#hint p {
  font-size:14px; color:rgba(255,255,255,0.55);
  background:rgba(0,0,0,0.4); backdrop-filter:blur(8px);
  padding:10px 18px; border-radius:20px;
  border:1px solid rgba(255,255,255,0.1);
}

/* BOTTOM PANEL */
#bottom-panel {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(to top,rgba(0,0,0,0.96) 65%,transparent 100%);
  padding:20px 20px max(env(safe-area-inset-bottom,20px),20px);
  z-index:10;
}

/* COLOR DISPLAY */
#color-display { display:flex; align-items:center; gap:14px; margin-bottom:12px; }
#color-swatch {
  width:68px; height:68px; border-radius:14px;
  border:2px solid rgba(255,255,255,0.15); flex-shrink:0;
  transition:background-color 0.1s ease, box-shadow 0.2s;
  position:relative; overflow:hidden;
}
#color-swatch::after {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,0.13) 0%,transparent 50%);
}
#color-info { flex:1; min-width:0; }
#color-name {
  font-size:26px; font-weight:600; letter-spacing:-0.02em;
  line-height:1.1; margin-bottom:3px; transition:color 0.2s;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#color-badges { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
#color-desc { font-size:12px; color:var(--text-muted); }
#lum-pill {
  font-size:10px; letter-spacing:0.06em; padding:2px 8px;
  border-radius:10px; border:1px solid; opacity:0.8; display:none;
}

/* TECH DETAILS */
#tech-details {
  display:grid; grid-template-columns:1fr 1fr 1fr 1fr;
  gap:6px; margin-bottom:12px;
}
.detail-chip {
  background:rgba(255,255,255,0.06); border:1px solid var(--border);
  border-radius:10px; padding:7px 6px; text-align:center;
}
.detail-chip label {
  display:block; font-size:9px; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--text-muted); margin-bottom:2px;
}
.detail-chip span { font-size:12px; font-weight:500; font-variant-numeric:tabular-nums; }

/* TTS + STABILIZE BUTTONS */
#action-row { display:flex; gap:8px; margin-bottom:12px; }
.action-btn {
  flex:1; padding:9px 0; border-radius:12px; border:1px solid var(--border);
  background:rgba(255,255,255,0.07); color:var(--text);
  font-size:12px; font-family:var(--font); cursor:pointer;
  display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background 0.2s;
}
.action-btn:active { background:rgba(255,255,255,0.14); }
.action-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }
#tts-btn .icon { font-size:15px; }

/* MODE BUTTONS */
#mode-label {
  font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
  color:var(--text-muted); margin-bottom:7px;
}
#mode-buttons {
  display:flex; gap:6px; overflow-x:auto;
  scrollbar-width:none; -ms-overflow-style:none;
}
#mode-buttons::-webkit-scrollbar { display:none; }
.mode-btn {
  flex-shrink:0; padding:7px 13px; border-radius:20px;
  border:1px solid var(--border); background:rgba(255,255,255,0.05);
  color:var(--text-muted); font-size:12px; font-family:var(--font);
  cursor:pointer; transition:all 0.2s; white-space:nowrap;
}
.mode-btn.active { background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

/* PERMISSION */
#permission-screen {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  background:var(--bg); z-index:100; padding:40px 30px; text-align:center;
}
#permission-screen.hidden { display:none; }
#perm-icon { font-size:54px; margin-bottom:22px; }
#perm-title { font-size:24px; font-weight:600; margin-bottom:10px; letter-spacing:-0.01em; }
#perm-desc { font-size:15px; color:var(--text-muted); line-height:1.6; margin-bottom:30px; max-width:300px; }
#perm-btn {
  padding:14px 36px; background:var(--accent); color:#000;
  border:none; border-radius:50px; font-size:16px; font-weight:600;
  font-family:var(--font); cursor:pointer;
}

/* STABLE FLASH */
@keyframes stableFlash {
  0%{opacity:1} 40%{opacity:0.3} 100%{opacity:1}
}
#stable-indicator {
  position:absolute; inset:0; background:rgba(255,255,255,0.06);
  pointer-events:none; opacity:0; border-radius:inherit;
}
#stable-indicator.flash { animation:stableFlash 0.4s ease-out; }
</style>
</head>
<body>
<div id="app">

  <!-- Permission -->
  <div id="permission-screen">
    <div id="perm-icon">📷</div>
    <div id="perm-title">ChromaVue</div>
    <div id="perm-desc">Pointez votre caméra vers n'importe quel objet et touchez l'écran pour identifier sa couleur réelle. Conçu pour les daltoniens.</div>
    <button id="perm-btn" onclick="startCamera()">Activer la caméra</button>
  </div>

  <!-- Camera -->
  <div id="camera-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas-hidden"></canvas>

    <!-- Magnifier -->
    <div id="magnifier"><canvas id="mag-canvas" width="90" height="90"></canvas></div>

    <!-- Hint -->
    <div id="hint"><p>Touchez l'écran pour détecter</p></div>

    <!-- Crosshair -->
    <div id="crosshair" style="left:50%;top:50%">
      <svg viewBox="0 0 52 52" fill="none">
        <circle cx="26" cy="26" r="15" stroke="white" stroke-width="1.5" stroke-opacity="0.9"/>
        <circle cx="26" cy="26" r="3.5" fill="white" fill-opacity="0.95"/>
        <line x1="26" y1="4"  x2="26" y2="13" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
        <line x1="26" y1="39" x2="26" y2="48" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
        <line x1="4"  y1="26" x2="13" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
        <line x1="39" y1="26" x2="48" y2="26" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
      </svg>
    </div>

    <!-- Stability ring -->
    <div id="stability-ring" style="left:50%;top:50%">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="25" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
        <circle id="stab-arc" cx="32" cy="32" r="25"
          stroke="#e8c46a" stroke-width="2.5" stroke-linecap="round"
          transform="rotate(-90 32 32)"
          stroke-dasharray="0 157"/>
      </svg>
    </div>

    <!-- Live badge -->
    <div id="live-badge"><div id="live-dot"></div><span>LIVE</span></div>

    <!-- Luminosity -->
    <div id="lum-badge"><span id="lum-icon">☀️</span><span id="lum-text">—</span></div>

    <!-- History -->
    <div id="history-strip"></div>
  </div>

  <!-- Top bar -->
  <div id="topbar">
    <div id="app-title">Chroma<span>Vue</span></div>
    <button class="top-btn" id="tts-toggle-btn" onclick="toggleTTS()" title="Lecture vocale">🔊</button>
    <button class="top-btn" id="flash-btn" onclick="toggleFlash()" title="Lampe torche">💡</button>
  </div>

  <!-- Bottom panel -->
  <div id="bottom-panel">
    <div id="color-display">
      <div id="color-swatch" style="background:#888">
        <div id="stable-indicator"></div>
      </div>
      <div id="color-info">
        <div id="color-name">—</div>
        <div id="color-badges">
          <div id="color-desc">Touchez l'écran pour analyser</div>
          <div id="lum-pill"></div>
        </div>
      </div>
    </div>

    <div id="tech-details">
      <div class="detail-chip"><label>Hex</label><span id="val-hex">—</span></div>
      <div class="detail-chip"><label>RVB</label><span id="val-rgb">—</span></div>
      <div class="detail-chip"><label>Teinte</label><span id="val-hue">—</span></div>
      <div class="detail-chip"><label>Sat.</label><span id="val-sat">—</span></div>
    </div>

    <div id="action-row">
      <button class="action-btn" id="tts-btn" onclick="speakColor()">
        <span class="icon">🔊</span><span>Énoncer</span>
      </button>
      <button class="action-btn" id="freeze-btn" onclick="toggleFreeze()">
        <span class="icon">❄️</span><span id="freeze-label">Figer</span>
      </button>
      <button class="action-btn" onclick="copyColor()">
        <span class="icon">📋</span><span>Copier</span>
      </button>
    </div>

    <div id="mode-label">Simulation daltonisme</div>
    <div id="mode-buttons">
      <button class="mode-btn active" data-mode="normal" onclick="setMode(this)">Normal</button>
      <button class="mode-btn" data-mode="deuteranopia" onclick="setMode(this)">Deutéranopie</button>
      <button class="mode-btn" data-mode="protanopia" onclick="setMode(this)">Protanopie</button>
      <button class="mode-btn" data-mode="tritanopia" onclick="setMode(this)">Tritanopie</button>
      <button class="mode-btn" data-mode="achromatopsia" onclick="setMode(this)">Achromatopsie</button>
    </div>
  </div>

</div>
<script>
// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
let stream=null, track=null, flashOn=false, ttsEnabled=true;
let currentMode='normal', colorHistory=[], frozen=false;
let cameraReady=false, liveInterval=null;
let lastColorName='', stabilityCount=0, stabilityTarget=3;
let pendingName='', pendingColor=null;
let lastSpoken='', zoomIdx=0;

const video=document.getElementById('video');
const canvas=document.getElementById('canvas-hidden');
const ctx=canvas.getContext('2d',{willReadFrequently:true});
const magCanvas=document.getElementById('mag-canvas');
const magCtx=magCanvas.getContext('2d');
const crosshair=document.getElementById('crosshair');
const stabRing=document.getElementById('stability-ring');
const stabArc=document.getElementById('stab-arc');
const hint=document.getElementById('hint');
const magnifier=document.getElementById('magnifier');

// ═══════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════
async function startCamera() {
  try {
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false
    });
    video.srcObject=stream;
    track=stream.getVideoTracks()[0];
    await new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true}));
    video.play();
    document.getElementById('permission-screen').classList.add('hidden');
    cameraReady=true;
    liveInterval=setInterval(sampleCenter,250);
    setupTouch();
  } catch(e) {
    alert('Accès caméra refusé : '+e.message);
  }
}

// ═══════════════════════════════════════════
//  LIVE SAMPLING
// ═══════════════════════════════════════════
function sampleCenter() {
  if(!cameraReady||frozen||video.paused||video.videoWidth===0) return;
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);
  const cx=Math.floor(canvas.width/2), cy=Math.floor(canvas.height/2);
  const px=sampleRobust(cx,cy,10);
  if(px) {
    const cd=analyzeColor(px.r,px.g,px.b);
    updateLiveUI(cd);
    checkStability(cd);
  }
}

// ═══════════════════════════════════════════
//  STABILITY SYSTEM
// ═══════════════════════════════════════════
function checkStability(cd) {
  if(cd.name.name===lastColorName) {
    stabilityCount=Math.min(stabilityCount+1, stabilityTarget);
  } else {
    stabilityCount=0;
    pendingName=cd.name.name;
    pendingColor=cd;
  }

  const ratio=stabilityCount/stabilityTarget;
  const circ=2*Math.PI*25; // circumference of r=25
  stabArc.setAttribute('stroke-dasharray', `${ratio*circ} ${circ}`);

  if(ratio>0 && ratio<1) {
    stabRing.classList.add('show');
  }

  if(stabilityCount>=stabilityTarget && cd.name.name!==lastColorName) {
    lastColorName=cd.name.name;
    stabRing.classList.remove('show');
    stabArc.setAttribute('stroke-dasharray',`0 157`);
    stabilityCount=0;
    confirmColor(cd);
  }
}

function confirmColor(cd) {
  // Flash feedback
  const ind=document.getElementById('stable-indicator');
  ind.classList.remove('flash');
  void ind.offsetWidth;
  ind.classList.add('flash');
  // Haptic
  haptic('light');
  // TTS if enabled
  if(ttsEnabled && cd.name.name!==lastSpoken) {
    lastSpoken=cd.name.name;
    speak(cd.name.name);
  }
  updatePinnedUI(cd);
  addToHistory(cd);
}

// ═══════════════════════════════════════════
//  TOUCH
// ═══════════════════════════════════════════
function setupTouch() {
  const cont=document.getElementById('camera-container');
  cont.addEventListener('touchstart', onTouchStart, {passive:true});
  cont.addEventListener('touchend', onTouchEnd, {passive:false});
  cont.addEventListener('touchmove', onTouchMove, {passive:true});
  cont.addEventListener('click', handleTap);
}

let touchActive=false, touchX=0, touchY=0;

function onTouchStart(e) {
  const t=e.touches[0];
  touchX=t.clientX; touchY=t.clientY;
  touchActive=true;
  showMagnifier(t.clientX, t.clientY);
}

function onTouchMove(e) {
  if(!touchActive) return;
  const t=e.touches[0];
  touchX=t.clientX; touchY=t.clientY;
  moveMagnifier(t.clientX, t.clientY);
}

function onTouchEnd(e) {
  touchActive=false;
  hideMagnifier();
  e.preventDefault();
  const t=e.changedTouches[0];
  handleTap({clientX:t.clientX, clientY:t.clientY, currentTarget:document.getElementById('camera-container')});
}

function handleTap(e) {
  if(!cameraReady||video.videoWidth===0) return;
  const cont=document.getElementById('camera-container');
  const rect=cont.getBoundingClientRect();
  const x=e.clientX-rect.left, y=e.clientY-rect.top;

  // Move crosshair
  crosshair.style.left=x+'px'; crosshair.style.top=y+'px';
  crosshair.classList.add('tap');
  setTimeout(()=>crosshair.classList.remove('tap'),200);

  // Ripple
  const rip=document.createElement('div');
  rip.className='ripple'; rip.style.left=x+'px'; rip.style.top=y+'px';
  cont.appendChild(rip); setTimeout(()=>rip.remove(),560);

  hint.classList.add('hidden');

  // Sample (mirrored)
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);
  const rect2=cont.getBoundingClientRect();
  const mx=1-(x/rect2.width), my=y/rect2.height;
  const px=sampleRobust(Math.floor(mx*canvas.width), Math.floor(my*canvas.height), 14);

  if(px) {
    haptic('medium');
    const cd=analyzeColor(px.r,px.g,px.b);
    updatePinnedUI(cd);
    addToHistory(cd);
    if(ttsEnabled) { lastSpoken=cd.name.name; speak(cd.name.name); }
  }
}

// ═══════════════════════════════════════════
//  MAGNIFIER
// ═══════════════════════════════════════════
function showMagnifier(cx, cy) {
  magnifier.style.display='block';
  moveMagnifier(cx, cy);
}

function moveMagnifier(cx, cy) {
  const cont=document.getElementById('camera-container');
  const rect=cont.getBoundingClientRect();
  const x=cx-rect.left, y=cy-rect.top;
  magnifier.style.left=x+'px';
  magnifier.style.top=y+'px';

  if(!cameraReady||video.videoWidth===0) return;
  canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  ctx.drawImage(video,0,0);

  const mx=(1-(x/rect.width))*canvas.width;
  const my=(y/rect.height)*canvas.height;
  const zoom=4, size=90;
  const sx=mx-(size/zoom/2), sy=my-(size/zoom/2);
  const sw=size/zoom, sh=size/zoom;

  magCtx.clearRect(0,0,90,90);
  magCtx.save();
  magCtx.beginPath();
  magCtx.arc(45,45,45,0,Math.PI*2);
  magCtx.clip();
  magCtx.drawImage(canvas, sx,sy,sw,sh, 0,0,90,90);
  // Center dot
  magCtx.beginPath();
  magCtx.arc(45,45,3,0,Math.PI*2);
  magCtx.fillStyle='rgba(255,255,255,0.9)';
  magCtx.fill();
  magCtx.restore();
}

function hideMagnifier() {
  magnifier.style.display='none';
}

// ═══════════════════════════════════════════
//  ROBUST PIXEL SAMPLING (médiane, ignore aberrants)
// ═══════════════════════════════════════════
function sampleRobust(cx,cy,radius) {
  const x0=Math.max(0,cx-radius), y0=Math.max(0,cy-radius);
  const w=Math.min(radius*2,canvas.width-x0), h=Math.min(radius*2,canvas.height-y0);
  if(w<=0||h<=0) return null;
  const data=ctx.getImageData(x0,y0,w,h).data;
  const rs=[],gs=[],bs=[];
  for(let i=0;i<data.length;i+=4){ rs.push(data[i]); gs.push(data[i+1]); bs.push(data[i+2]); }
  return { r:median(rs), g:median(gs), b:median(bs) };
}

function median(arr) {
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2? s[m]: Math.round((s[m-1]+s[m])/2);
}

// ═══════════════════════════════════════════
//  COLOR ANALYSIS — espace LAB
// ═══════════════════════════════════════════
function analyzeColor(r,g,b) {
  const sim=simulateColorblindness(r,g,b,currentMode);
  r=sim.r; g=sim.g; b=sim.b;
  const hex='#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
  const hsl=rgbToHsl(r,g,b);
  const lab=rgbToLab(r,g,b);
  const name=getColorNameLAB(lab.L,lab.a,lab.b_);
  const luminosity=getLuminosity(r,g,b);
  return {r,g,b,hex,hsl,lab,name,luminosity};
}

function rgbToHsl(r,g,b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b);
  let h,s,l=(max+min)/2;
  if(max===min){h=s=0;}
  else{
    const d=max-min;
    s=l>0.5?d/(2-max-min):d/(max+min);
    switch(max){
      case r:h=((g-b)/d+(g<b?6:0))/6;break;
      case g:h=((b-r)/d+2)/6;break;
      case b:h=((r-g)/d+4)/6;break;
    }
  }
  return {h:Math.round(h*360),s:Math.round(s*100),l:Math.round(l*100)};
}

// sRGB → CIE L*a*b* (bien plus proche perception humaine)
function rgbToLab(r,g,b) {
  let R=r/255,G=g/255,B=b/255;
  R=R>0.04045?Math.pow((R+0.055)/1.055,2.4):R/12.92;
  G=G>0.04045?Math.pow((G+0.055)/1.055,2.4):G/12.92;
  B=B>0.04045?Math.pow((B+0.055)/1.055,2.4):B/12.92;
  let X=(R*0.4124+G*0.3576+B*0.1805)/0.95047;
  let Y=(R*0.2126+G*0.7152+B*0.0722)/1.00000;
  let Z=(R*0.0193+G*0.1192+B*0.9505)/1.08883;
  const f=t=>t>0.008856?Math.cbrt(t):(7.787*t+16/116);
  const L=116*f(Y)-16, a=500*(f(X)-f(Y)), bv=200*(f(Y)-f(Z));
  return {L,a,b_:bv};
}

function deltaE(L1,a1,b1,L2,a2,b2) {
  return Math.sqrt((L1-L2)**2+(a1-a2)**2+(b1-b2)**2);
}

function getLuminosity(r,g,b) {
  const lum=0.299*r+0.587*g+0.114*b;
  if(lum>200) return {label:'Très clair',icon:'☀️',level:3};
  if(lum>130) return {label:'Clair',icon:'🌤',level:2};
  if(lum>70)  return {label:'Moyen',icon:'⛅',level:1};
  if(lum>30)  return {label:'Sombre',icon:'🌑',level:0};
  return {label:'Très sombre',icon:'🌑',level:0};
}

// Pre-compute LAB values
const COLOR_DB_LAB = COLOR_DB.map(c=>{
  const lab=rgbToLab(c.r,c.g,c.b);
  return {...c, L:lab.L, a:lab.a, b_:lab.b_};
});

function getColorNameLAB(L,a,b) {
  let minD=Infinity, best=COLOR_DB_LAB[0];
  for(const c of COLOR_DB_LAB) {
    const d=deltaE(L,a,b, c.L,c.a,c.b_);
    if(d<minD){minD=d;best=c;}
  }
  return {name:best.name, desc:best.desc};
}

// ═══════════════════════════════════════════
//  COLORBLIND SIMULATION
// ═══════════════════════════════════════════
function simulateColorblindness(r,g,b,mode) {
  if(mode==='normal') return {r,g,b};
  let R=r/255,G=g/255,B=b/255;
  const matrices={
    deuteranopia:[[0.625,0.375,0],[0.700,0.300,0],[0,0.300,0.700]],
    protanopia:[[0.567,0.433,0],[0.558,0.442,0],[0,0.242,0.758]],
    tritanopia:[[0.950,0.050,0],[0,0.433,0.567],[0,0.475,0.525]],
    achromatopsia:[[0.299,0.587,0.114],[0.299,0.587,0.114],[0.299,0.587,0.114]]
  };
  const m=matrices[mode]; if(!m) return {r,g,b};
  return {
    r:Math.round(Math.min(1,Math.max(0,m[0][0]*R+m[0][1]*G+m[0][2]*B))*255),
    g:Math.round(Math.min(1,Math.max(0,m[1][0]*R+m[1][1]*G+m[1][2]*B))*255),
    b:Math.round(Math.min(1,Math.max(0,m[2][0]*R+m[2][1]*G+m[2][2]*B))*255)
  };
}

// ═══════════════════════════════════════════
//  UPDATE UI
// ═══════════════════════════════════════════
function updateLiveUI(cd) {
  document.getElementById('color-swatch').style.background=cd.hex;
  document.getElementById('color-swatch').style.boxShadow=`0 0 18px ${cd.hex}44`;
  document.getElementById('val-hex').textContent=cd.hex.toUpperCase();
  document.getElementById('val-rgb').textContent=`${cd.r},${cd.g},${cd.b}`;
  document.getElementById('val-hue').textContent=`${cd.hsl.h}°`;
  document.getElementById('val-sat').textContent=`${cd.hsl.s}%`;
  updateLuminosity(cd.luminosity);
}

function updatePinnedUI(cd) {
  updateLiveUI(cd);
  document.getElementById('color-name').textContent=cd.name.name;
  document.getElementById('color-desc').textContent=cd.name.desc;
  // Luminosity pill
  const pill=document.getElementById('lum-pill');
  pill.style.display='block';
  pill.textContent=cd.luminosity.label;
  const lumColors=['rgba(100,80,50,0.8)','rgba(60,80,60,0.8)','rgba(80,100,60,0.8)','rgba(220,180,80,0.8)'];
  pill.style.background=lumColors[cd.luminosity.level]||'rgba(80,80,80,0.8)';
  pill.style.borderColor='rgba(255,255,255,0.15)';
  pill.style.color='rgba(255,255,255,0.85)';
}

function updateLuminosity(lum) {
  document.getElementById('lum-icon').textContent=lum.icon;
  document.getElementById('lum-text').textContent=lum.label;
}

// ═══════════════════════════════════════════
//  HISTORY
// ═══════════════════════════════════════════
function addToHistory(cd) {
  if(colorHistory.length>0 && colorHistory[0].name.name===cd.name.name) return;
  colorHistory.unshift(cd);
  if(colorHistory.length>6) colorHistory.pop();
  const strip=document.getElementById('history-strip');
  strip.innerHTML='';
  colorHistory.forEach(c=>{
    const sw=document.createElement('div');
    sw.className='hist-swatch';
    sw.style.background=c.hex;
    sw.style.boxShadow=`0 2px 8px ${c.hex}66`;
    sw.title=c.name.name;
    sw.onclick=()=>{ updatePinnedUI(c); if(ttsEnabled) speak(c.name.name); };
    strip.appendChild(sw);
  });
}

// ═══════════════════════════════════════════
//  TEXT TO SPEECH
// ═══════════════════════════════════════════
function speak(text) {
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang='fr-FR'; utt.rate=0.95; utt.pitch=1;
  // Find French voice if available
  const voices=window.speechSynthesis.getVoices();
  const fr=voices.find(v=>v.lang.startsWith('fr'));
  if(fr) utt.voice=fr;
  window.speechSynthesis.speak(utt);
}

function speakColor() {
  const name=document.getElementById('color-name').textContent;
  if(name && name!=='—') speak(name);
}

function toggleTTS() {
  ttsEnabled=!ttsEnabled;
  document.getElementById('tts-toggle-btn').classList.toggle('active',ttsEnabled);
  if(ttsEnabled) speak('Lecture vocale activée');
  else window.speechSynthesis && window.speechSynthesis.cancel();
}

// ═══════════════════════════════════════════
//  FREEZE
// ═══════════════════════════════════════════
function toggleFreeze() {
  frozen=!frozen;
  document.getElementById('freeze-btn').classList.toggle('active',frozen);
  document.getElementById('freeze-label').textContent=frozen?'Reprendre':'Figer';
  document.getElementById('live-dot').style.background=frozen?'#e8c46a':'#4caf50';
}

// ═══════════════════════════════════════════
//  COPY
// ═══════════════════════════════════════════
function copyColor() {
  const hex=document.getElementById('val-hex').textContent;
  const name=document.getElementById('color-name').textContent;
  if(hex==='—') return;
  navigator.clipboard?.writeText(`${name} — ${hex}`).then(()=>{
    const btn=document.querySelector('.action-btn:last-child span:last-child');
    if(btn){btn.textContent='Copié !'; setTimeout(()=>btn.textContent='Copier',1500);}
  });
}

// ═══════════════════════════════════════════
//  HAPTIC
// ═══════════════════════════════════════════
function haptic(type) {
  if(!navigator.vibrate) return;
  const patterns={light:[20], medium:[35], heavy:[50,30,50]};
  navigator.vibrate(patterns[type]||[20]);
}

// ═══════════════════════════════════════════
//  FLASH
// ═══════════════════════════════════════════
async function toggleFlash() {
  if(!track) return;
  const caps=track.getCapabilities?track.getCapabilities():{};
  if(!caps.torch){ alert('Lampe torche non disponible'); return; }
  flashOn=!flashOn;
  await track.applyConstraints({advanced:[{torch:flashOn}]});
  document.getElementById('flash-btn').classList.toggle('active',flashOn);
}

// ═══════════════════════════════════════════
//  MODE
// ═══════════════════════════════════════════
function setMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentMode=btn.dataset.mode;
  stabilityCount=0; lastColorName='';
}

// Init TTS active by default
document.getElementById('tts-toggle-btn').classList.add('active');

// Load voices
if('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
}
