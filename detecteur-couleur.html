<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0f0f0f">
<title>ChromaVue — Détecteur de couleurs</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: rgba(255,255,255,0.08);
    --text: #f0ede8;
    --text-muted: rgba(240,237,232,0.5);
    --accent: #e8c46a;
    --accent-dim: rgba(232,196,106,0.15);
    --radius: 16px;
    --font: 'Helvetica Neue', Arial, sans-serif;
  }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ─── CAMERA LAYER ─── */
  #camera-container {
    position: relative;
    flex: 1;
    overflow: hidden;
    background: #000;
  }

  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transform: scaleX(-1);
  }

  #canvas-hidden {
    display: none;
  }

  /* ─── CROSSHAIR ─── */
  #crosshair {
    position: absolute;
    width: 48px;
    height: 48px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  #crosshair.tap { transform: translate(-50%, -50%) scale(0.85); }

  #crosshair svg { width: 100%; height: 100%; }

  /* ─── TOUCH RIPPLE ─── */
  .ripple {
    position: absolute;
    border-radius: 50%;
    width: 80px;
    height: 80px;
    transform: translate(-50%, -50%) scale(0);
    border: 2px solid rgba(255,255,255,0.6);
    animation: rippleAnim 0.5s ease-out forwards;
    pointer-events: none;
  }

  @keyframes rippleAnim {
    to { transform: translate(-50%, -50%) scale(1); opacity: 0; }
  }

  /* ─── TOP BAR ─── */
  #topbar {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: env(safe-area-inset-top, 12px) 20px 12px;
    padding-top: max(env(safe-area-inset-top, 12px), 12px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    z-index: 10;
  }

  #app-title {
    font-size: 18px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--text);
  }

  #app-title span {
    color: var(--accent);
    font-weight: 500;
  }

  #flash-btn {
    width: 36px;
    height: 36px;
    border: none;
    background: rgba(255,255,255,0.12);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 16px;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
  }

  #flash-btn.active { background: var(--accent); color: #000; }

  /* ─── BOTTOM PANEL ─── */
  #bottom-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.95) 60%, transparent 100%);
    padding: 24px 20px;
    padding-bottom: max(env(safe-area-inset-bottom, 20px), 20px);
    z-index: 10;
  }

  /* ─── COLOR DISPLAY ─── */
  #color-display {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
  }

  #color-swatch {
    width: 72px;
    height: 72px;
    border-radius: 14px;
    border: 2px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
    transition: background-color 0.12s ease;
    position: relative;
    overflow: hidden;
  }

  #color-swatch::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
    border-radius: inherit;
  }

  #color-info { flex: 1; min-width: 0; }

  #color-name {
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.1;
    margin-bottom: 4px;
    transition: color 0.2s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #color-desc {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.4;
  }

  /* ─── TECH DETAILS ─── */
  #tech-details {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }

  .detail-chip {
    background: rgba(255,255,255,0.07);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }

  .detail-chip label {
    display: block;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 3px;
  }

  .detail-chip span {
    font-size: 13px;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* ─── COLORBLIND MODES ─── */
  #mode-section { margin-bottom: 0; }

  #mode-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  #mode-buttons {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  #mode-buttons::-webkit-scrollbar { display: none; }

  .mode-btn {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text-muted);
    font-size: 12px;
    font-family: var(--font);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .mode-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ─── LIVE INDICATOR ─── */
  #live-badge {
    position: absolute;
    top: 60px; left: 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.6);
    z-index: 10;
  }

  #live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #4caf50;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ─── PERMISSION SCREEN ─── */
  #permission-screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    z-index: 100;
    padding: 40px 30px;
    text-align: center;
  }

  #permission-screen.hidden { display: none; }

  #perm-icon {
    font-size: 56px;
    margin-bottom: 24px;
    opacity: 0.9;
  }

  #perm-title {
    font-size: 24px;
    font-weight: 600;
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }

  #perm-desc {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 32px;
    max-width: 300px;
  }

  #perm-btn {
    padding: 14px 36px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 50px;
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    letter-spacing: 0.01em;
  }

  /* ─── HISTORY STRIP ─── */
  #history-strip {
    position: absolute;
    top: 60px; right: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 8px;
    z-index: 10;
  }

  .hist-swatch {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1.5px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.15s;
    flex-shrink: 0;
  }

  .hist-swatch:active { transform: scale(0.9); }

  /* ─── INSTRUCTION HINT ─── */
  #hint {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    transition: opacity 0.4s;
  }

  #hint.hidden { opacity: 0; }

  #hint p {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(8px);
    padding: 10px 18px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }

  /* ─── ZOOM BUTTON ─── */
  #zoom-btn {
    position: absolute;
    bottom: 230px; right: 16px;
    width: 44px;
    height: 44px;
    border: none;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    z-index: 10;
    border: 1px solid var(--border);
    transition: background 0.2s;
  }

  #zoom-btn:active { background: rgba(255,255,255,0.2); }

  #zoom-label {
    position: absolute;
    bottom: 280px; right: 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    z-index: 10;
    text-align: center;
    width: 60px;
  }
</style>

        <button class="mode-btn" data-mode="tritanopia" onclick="setMode(this)">Tritanopie</button>

</div>

<script>
// ─────────────────────────────────────────────
//  STATE
// ─────────────────────────────────────────────
let stream = null;
let track = null;
let flashOn = false;
let currentMode = 'normal';
let colorHistory = [];
let zoomLevels = [1, 2, 3];
let zoomIdx = 0;
let lastTouchedColor = null;
let cameraReady = false;
let liveInterval = null;

const video = document.getElementById('video');
const canvas = document.getElementById('canvas-hidden');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const crosshair = document.getElementById('crosshair');
const hint = document.getElementById('hint');

// ─────────────────────────────────────────────
//  CAMERA
// ─────────────────────────────────────────────
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });

    video.srcObject = stream;
    track = stream.getVideoTracks()[0];

    await new Promise(r => video.addEventListener('loadedmetadata', r, { once: true }));
    video.play();

    document.getElementById('permission-screen').classList.add('hidden');
    cameraReady = true;

    // Check zoom capability
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.zoom) {
      document.getElementById('zoom-btn').style.display = 'flex';
      document.getElementById('zoom-label').style.display = 'block';
    }

    // Start live color sampling from center
    liveInterval = setInterval(sampleCenter, 300);

    setupTouch();

  } catch(e) {
    alert('Impossible d\'accéder à la caméra : ' + e.message);
  }
}

// ─────────────────────────────────────────────
//  LIVE SAMPLING (center)
// ─────────────────────────────────────────────
function sampleCenter() {
  if (!cameraReady || video.paused || video.videoWidth === 0) return;

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const cx = Math.floor(canvas.width / 2);
  const cy = Math.floor(canvas.height / 2);
  const px = samplePixelAvg(cx, cy, 8);

  if (px) {
    const colorData = analyzeColor(px.r, px.g, px.b);
    updateUI(colorData, null, false);
  }
}

// ─────────────────────────────────────────────
//  TOUCH HANDLER
// ─────────────────────────────────────────────
function setupTouch() {
  const container = document.getElementById('camera-container');

  container.addEventListener('click', handleTap);
  container.addEventListener('touchend', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    handleTap({ clientX: t.clientX, clientY: t.clientY, currentTarget: container });
  }, { passive: false });
}

function handleTap(e) {
  if (!cameraReady || video.videoWidth === 0) return;

  const rect = e.currentTarget.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  // Move crosshair
  crosshair.style.left = x + 'px';
  crosshair.style.top = y + 'px';
  crosshair.classList.add('tap');
  setTimeout(() => crosshair.classList.remove('tap'), 200);

  // Ripple
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  e.currentTarget.appendChild(ripple);
  setTimeout(() => ripple.remove(), 500);

  // Hide hint
  hint.classList.add('hidden');

  // Sample pixel (mirrored video: flip x)
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);

  const ratioX = x / rect.width;
  const ratioY = y / rect.height;
  const mirroredX = 1 - ratioX; // account for CSS scaleX(-1)
  const px = samplePixelAvg(
    Math.floor(mirroredX * canvas.width),
    Math.floor(ratioY * canvas.height),
    12
  );

  if (px) {
    const colorData = analyzeColor(px.r, px.g, px.b);
    updateUI(colorData, { r: px.r, g: px.g, b: px.b }, true);
    addToHistory(colorData);
  }
}

// ─────────────────────────────────────────────
//  PIXEL SAMPLING (average over area)
// ─────────────────────────────────────────────
function samplePixelAvg(cx, cy, radius) {
  const x0 = Math.max(0, cx - radius);
  const y0 = Math.max(0, cy - radius);
  const w = Math.min(radius * 2, canvas.width - x0);
  const h = Math.min(radius * 2, canvas.height - y0);
  if (w <= 0 || h <= 0) return null;

  const data = ctx.getImageData(x0, y0, w, h).data;
  let r = 0, g = 0, b = 0, count = 0;
  for (let i = 0; i < data.length; i += 4) {
    r += data[i];
    g += data[i+1];
    b += data[i+2];
    count++;
  }
  return { r: Math.round(r/count), g: Math.round(g/count), b: Math.round(b/count) };
}

// ─────────────────────────────────────────────
//  COLOR ANALYSIS
// ─────────────────────────────────────────────
function analyzeColor(r, g, b) {
  // Apply colorblind simulation
  const sim = simulateColorblindness(r, g, b, currentMode);
  r = sim.r; g = sim.g; b = sim.b;

  const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
  const hsl = rgbToHsl(r, g, b);
  const name = getColorName(r, g, b, hsl);

  return { r, g, b, hex, hsl, name };
}

function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d / (2-max-min) : d / (max+min);
    switch(max) {
      case r: h = ((g-b)/d + (g<b?6:0))/6; break;
      case g: h = ((b-r)/d + 2)/6; break;
      case b: h = ((r-g)/d + 4)/6; break;
    }
  }
  return { h: Math.round(h*360), s: Math.round(s*100), l: Math.round(l*100) };
}

//  COLOR NAME DATABASE
// ─────────────────────────────────────────────
const COLOR_DB = [

  { name: 'Rose poudré', desc: 'Rose très clair', r:255,g:210,b:220 },
  { name: 'Rose fuchsia', desc: 'Rose magenta', r:255,g:0,b:255 },
  // Oranges
  { name: 'Orange vif', desc: 'Orange primaire', r:255,g:165,b:0 },
  { name: 'Orange brûlé', desc: 'Orange sombre', r:204,g:85,b:0 },
  { name: 'Mandarine', desc: 'Orange rouge', r:255,g:120,b:50 },
  { name: 'Pêche', desc: 'Orange pâle', r:255,g:218,b:185 },
  { name: 'Saumon', desc: 'Orange rosé', r:250,g:128,b:114 },
  { name: 'Abricot', desc: 'Orange doux', r:251,g:206,b:177 },
  { name: 'Rouille', desc: 'Orange brun', r:183,g:65,b:14 },

function getColorName(r, g, b, hsl) {
  let minDist = Infinity;
  let best = COLOR_DB[0];

  for (const c of COLOR_DB) {
    const d = Math.sqrt(
      Math.pow(r - c.r, 2) +
      Math.pow(g - c.g, 2) +
      Math.pow(b - c.b, 2)
    );
    if (d < minDist) { minDist = d; best = c; }
  }

  return { name: best.name, desc: best.desc };
}

// ─────────────────────────────────────────────
//  COLORBLIND SIMULATION
// ─────────────────────────────────────────────
function simulateColorblindness(r, g, b, mode) {
  if (mode === 'normal') return { r, g, b };

  // Normalise
  let R = r/255, G = g/255, B = b/255;

  // Linear (approximate)
  const matrices = {
    deuteranopia: [
      [0.625, 0.375, 0],
      [0.700, 0.300, 0],
      [0,     0.300, 0.700]
    ],
    protanopia: [
      [0.567, 0.433, 0],
      [0.558, 0.442, 0],
      [0,     0.242, 0.758]
    ],
    tritanopia: [
      [0.950, 0.050, 0],
      [0,     0.433, 0.567],
      [0,     0.475, 0.525]
    ],
    achromatopsia: [
      [0.299, 0.587, 0.114],
      [0.299, 0.587, 0.114],
      [0.299, 0.587, 0.114]
    ]
  };

  const m = matrices[mode];
  if (!m) return { r, g, b };

  const nR = Math.min(1, Math.max(0, m[0][0]*R + m[0][1]*G + m[0][2]*B));
  const nG = Math.min(1, Math.max(0, m[1][0]*R + m[1][1]*G + m[1][2]*B));
  const nB = Math.min(1, Math.max(0, m[2][0]*R + m[2][1]*G + m[2][2]*B));

  return { r: Math.round(nR*255), g: Math.round(nG*255), b: Math.round(nB*255) };
}

// ─────────────────────────────────────────────
//  UPDATE UI
// ─────────────────────────────────────────────
function updateUI(colorData, originalPx, isPinned) {
  const { r, g, b, hex, hsl, name } = colorData;

  document.getElementById('color-swatch').style.background = hex;

  if (isPinned || name) {
    document.getElementById('color-name').textContent = name.name;
    document.getElementById('color-name').style.color = '#fff';
    document.getElementById('color-desc').textContent = name.desc;
  }

  document.getElementById('val-hex').textContent = hex.toUpperCase();
  document.getElementById('val-rgb').textContent = `${r},${g},${b}`;
  document.getElementById('val-hue').textContent = `${hsl.h}°`;

  // Glow on swatch
  document.getElementById('color-swatch').style.boxShadow = `0 0 20px ${hex}55`;
}

// ─────────────────────────────────────────────
//  HISTORY
// ─────────────────────────────────────────────
function addToHistory(colorData) {
  colorHistory.unshift(colorData);
  if (colorHistory.length > 5) colorHistory.pop();

  const strip = document.getElementById('history-strip');
  strip.innerHTML = '';

  colorHistory.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'hist-swatch';
    sw.style.background = c.hex;
    sw.style.boxShadow = `0 0 8px ${c.hex}66`;
    sw.title = c.name.name;
    sw.onclick = () => updateUI(c, null, true);
    strip.appendChild(sw);
  });
}

// ─────────────────────────────────────────────
//  FLASH
// ─────────────────────────────────────────────
async function toggleFlash() {
  if (!track) return;
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (!caps.torch) {
    alert('Lampe torche non disponible sur cet appareil');
    return;
  }
  flashOn = !flashOn;
  await track.applyConstraints({ advanced: [{ torch: flashOn }] });
  document.getElementById('flash-btn').classList.toggle('active', flashOn);
}

// ─────────────────────────────────────────────
//  ZOOM
// ─────────────────────────────────────────────
async function cycleZoom() {
  if (!track) return;
  zoomIdx = (zoomIdx + 1) % zoomLevels.length;
  const z = zoomLevels[zoomIdx];

  try {
    const caps = track.getCapabilities();
    if (caps.zoom) {
      const min = caps.zoom.min, max = caps.zoom.max;
      const target = Math.min(max, Math.max(min, z));
      await track.applyConstraints({ advanced: [{ zoom: target }] });
    }
  } catch(e) {}

  document.getElementById('zoom-label').textContent = z + '×';
}

  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
